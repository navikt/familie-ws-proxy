# =============================================================================
# nginx-konfigurasjon for familie-ws-proxy.
#
# Denne fila kopieres til /etc/nginx/conf.d/default.conf og lastes automatisk av
# OpenResty sin standard-nginx.conf.
#
# Oppgaven er enkel: ta imot HTTPS-kall fra GCP, verifiser at kalleren har et
# gyldig Azure AD-token, og videresend requesten til riktig on-prem-tjeneste
# (STS eller CICS) basert på sti-prefikset.
# =============================================================================

# `notice`-nivå gjør at ngx.log(ngx.NOTICE, ...) i jwt.lua havner i loggen,
# slik at vi kan se hvilken applikasjon som kaller oss.
error_log logs/error.log notice;

server {
    # Porten nais ruter trafikk til (matcher `port: 8080` i .nais/app-*.yaml).
    listen       8080;
    server_name  localhost;

    # Lua bruker sin egen HTTP-klient når den henter Azure sine signeringsnøkler.
    # Den kjenner ikke systemets CA-lager automatisk, så vi må peke den dit,
    # ellers feiler TLS-håndtrykket mot login.microsoftonline.com.
    lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    # Standardverdien til lua_ssl_verify_depth er 1, som kun holder for et
    # sertifikatkjede-nivå. Azure AD sin kjede går via en mellomliggende CA
    # (og bytter noen ganger mellom flere slike), så med standardverdien
    # feiler verifiseringen sporadisk med "unable to get local issuer
    # certificate" avhengig av hvilken kjedelengde Microsoft svarer med der
    # og da. Vi øker derfor dybden til 3 for å dekke leaf -> intermediate ->
    # root uansett hvilken sertifikatkjede som blir returnert.
    lua_ssl_verify_depth 3;

    # `local=on` gjør at nginx bruker containerens /etc/resolv.conf til
    # DNS-oppslag. Dette er nødvendig fordi proxy_pass under bruker variabler
    # (se kommentar lenger ned), noe som tvinger nginx til å slå opp navnet
    # under kjøring i stedet for ved oppstart. ipv6 er slått av fordi
    # on-prem-tjenestene kun har A-records.
    resolver local=on ipv6=off;

    # Kjøres for hver innkommende request, før noen location matches.
    # Avviser requesten med 403 hvis tokenet mangler eller er ugyldig.
    access_by_lua_file jwt.lua;

    # Leser miljøvariablene inn i nginx-variabler slik at de kan brukes i
    # proxy_pass. Verdiene settes per miljø i .nais/app-dev.yaml og app-prod.yaml.
    set_by_lua $sts_base_url 'return os.getenv("STS_BASE_URL")';
    set_by_lua $cics_base_url 'return os.getenv("CICS_BASE_URL")';

    # Nullstiller Proxy-Authorization slik at et eventuelt token ikke lekker
    # videre til STS eller CICS. Merk at klienten uansett sender tokenet sitt i
    # X-Proxy-Authorization (se jwt.lua), fordi Java sin HttpClient fjerner
    # Proxy-Authorization på HTTPS-tilkoblinger.
    proxy_set_header Proxy-Authorization  "";

    # Simulering mot Oppdrag kan ta lang tid. Standard 60s ville uansett vært
    # nok i dag, men vi setter dem eksplisitt for å gjøre det tydelig at
    # proxyen ikke skal være det som kutter et tregt simuleringskall.
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Helsesjekk. Brukes av liveness og readiness i nais-konfigurasjonen.
    # Merk at `return` kjører i rewrite-fasen, altså *før* access-fasen der
    # jwt.lua kjøres. Requesten kortsluttes derfor med 200 uten at det kreves
    # token, som er nødvendig for at nais sine prober skal fungere.
    location / {
        add_header Content-Type text/plain;
        return 200;
    }

    # STS - henting av SAML-token for systembrukeren.
    # Eksempel: /sts/SecurityTokenServiceProvider/ -> $sts_base_url/SecurityTokenServiceProvider/
    #
    # Vi bruker en variabel i proxy_pass fordi verdien kommer fra en
    # miljøvariabel. Det har en viktig bieffekt: når proxy_pass inneholder en
    # variabel, videresender nginx den *originale* URI-en og ignorerer stien i
    # proxy_pass. Derfor må vi bruke `rewrite ... break` for å fjerne
    # /sts-prefikset før requesten sendes videre.
    location /sts/ {
        proxy_pass $sts_base_url;
        rewrite ^/sts/(.*) /$1 break;
    }

    # CICS - selve Simulering-kallet (SOAP) mot Oppdrag.
    # Eksempel dev:  /cics/oppdrag/simulerFpServiceWSBinding
    # Eksempel prod: /cics/cics/services/simulerFpServiceWSBinding
    # Samme rewrite-mekanikk som for /sts/.
    location /cics/ {
        proxy_pass $cics_base_url;
        rewrite ^/cics/(.*) /$1 break;
    }

    # Serverer OpenResty sin innebygde feilside ved serverfeil, i stedet for å
    # lekke feildetaljer fra nginx.
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/local/openresty/nginx/html;
    }
}
