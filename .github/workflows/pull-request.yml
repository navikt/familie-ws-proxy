name: Pull request
on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Bygg image (uten push)
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # ratchet:actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bygg docker image
        run: docker build --tag familie-ws-proxy:pr .
      - name: Valider nginx-konfigurasjon
        run: docker run --rm --entrypoint /usr/local/openresty/bin/openresty familie-ws-proxy:pr -t
