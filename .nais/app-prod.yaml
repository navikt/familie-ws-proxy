apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: familie-ws-proxy
  namespace: teamfamilie
  labels:
    team: teamfamilie
spec:
  image: {{ image }}
  port: 8080
  webproxy: true
  ingresses:
    - https://familie-ws-proxy.prod-fss-pub.nais.io
  accessPolicy:
    inbound:
      rules:
        - application: familie-oppdrag-backend
          cluster: prod-gcp
  env:
    - name: STS_BASE_URL
      value: https://sts.adeo.no
    - name: CICS_BASE_URL
      value: https://wasapp.adeo.no
  strategy:
    type: RollingUpdate
  azure:
    application:
      enabled: true
  liveness:
    path: /
    initialDelay: 1
  readiness:
    path: /
    initialDelay: 1
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 16Mi
  replicas:
    min: 2
    max: 2
  observability:
    logging:
      destinations:
        - id: elastic
        - id: loki
